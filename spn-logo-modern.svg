<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 160" width="480" height="160">
  <defs>
    <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a8a"/>
      <stop offset="100%" style="stop-color:#2563eb"/>
    </linearGradient>
    <linearGradient id="g2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3b82f6"/>
      <stop offset="100%" style="stop-color:#60a5fa"/>
    </linearGradient>
    <linearGradient id="g3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#dbeafe"/>
      <stop offset="100%" style="stop-color:#93c5fd"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#1e3a8a" flood-opacity="0.25"/>
    </filter>
    <clipPath id="icon-clip">
      <rect x="0" y="0" width="130" height="130" rx="22"/>
    </clipPath>
  </defs>

  <!-- ── ICON MARK ── -->
  <g transform="translate(15, 15)" filter="url(#shadow)">
    <!-- Base rounded square -->
    <rect x="0" y="0" width="130" height="130" rx="22" fill="url(#g1)"/>

    <!-- Geometric mesh overlay -->
    <polygon points="0,0 130,0 130,55" fill="#2563eb" opacity="0.35"/>
    <polygon points="0,130 60,130 0,70" fill="#1e40af" opacity="0.4"/>

    <!-- Accent bar bottom -->
    <rect x="0" y="112" width="130" height="18" rx="0" fill="url(#g2)" opacity="0.5" clip-path="url(#icon-clip)"/>
    <rect x="0" y="118" width="130" height="12" rx="0" fill="url(#g2)" opacity="0.4" clip-path="url(#icon-clip)"/>

    <!-- S letter — custom geometric -->
    <text x="20" y="88"
      font-family="'Arial Black', 'Helvetica Neue', sans-serif"
      font-size="60"
      font-weight="900"
      fill="white"
      letter-spacing="-2"
      opacity="1">S</text>

    <!-- P N small -->
    <text x="72" y="62"
      font-family="'Arial Black', 'Helvetica Neue', sans-serif"
      font-size="24"
      font-weight="900"
      fill="url(#g3)"
      letter-spacing="2">PN</text>

    <!-- Dot accent top-right -->
    <circle cx="112" cy="20" r="8" fill="#60a5fa" opacity="0.9"/>
    <circle cx="112" cy="20" r="4" fill="white"/>

    <!-- Thin line accent -->
    <rect x="68" y="68" width="46" height="2" rx="1" fill="#93c5fd" opacity="0.7"/>
  </g>

  <!-- ── COMPANY NAME ── -->
  <g transform="translate(165, 18)">

    <!-- SPN large wordmark -->
    <text x="0" y="38"
      font-family="'Arial Black', 'Helvetica Neue', Arial, sans-serif"
      font-size="32"
      font-weight="900"
      fill="url(#g1)"
      letter-spacing="6">SPN</text>

    <!-- Accent underline -->
    <rect x="0" y="44" width="295" height="2.5" rx="1.5" fill="url(#g2)"/>
    <rect x="0" y="49" width="180" height="1" rx="0.5" fill="#93c5fd" opacity="0.5"/>

    <!-- Thai name -->
    <text x="0" y="76"
      font-family="'Sarabun', 'Tahoma', 'Arial', sans-serif"
      font-size="16.5"
      font-weight="700"
      fill="#1e3a8a"
      letter-spacing="0.3">คอร์เปอเรท เซอร์วิส จำกัด</text>

    <!-- English full name -->
    <text x="0" y="100"
      font-family="'Helvetica Neue', Arial, sans-serif"
      font-size="11"
      font-weight="500"
      fill="#3b82f6"
      letter-spacing="2.5">CORPORATE SERVICES CO., LTD.</text>

    <!-- Divider dots -->
    <circle cx="0"   cy="118" r="2.5" fill="#3b82f6"/>
    <circle cx="10"  cy="118" r="2.5" fill="#60a5fa"/>
    <circle cx="20"  cy="118" r="2.5" fill="#93c5fd"/>

    <!-- Tagline -->
    <text x="32" y="122"
      font-family="'Sarabun', 'Helvetica Neue', sans-serif"
      font-size="10.5"
      font-weight="400"
      fill="#6b7280"
      letter-spacing="1">Professional · Reliable · Trusted</text>
  </g>
</svg>
