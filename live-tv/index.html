<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SX Live TV</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&family=Kanit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{
  --bg:#06070d;
  --bg2:#090b14;
  --bg3:#0e1020;
  --bg4:#131629;
  --surface:#161928;
  --surface2:#1c2035;
  --accent:#7c6ff7;
  --accent2:#5b54d6;
  --accent-glow:rgba(124,111,247,0.35);
  --red:#f04060;
  --red-dim:rgba(240,64,96,0.18);
  --green:#3dd68c;
  --txt:#f0f2ff;
  --txt2:#b8bdd8;
  --muted:#5a6080;
  --dim:#3a3f58;
  --border:rgba(255,255,255,0.05);
  --border2:rgba(255,255,255,0.1);
  --border3:rgba(124,111,247,0.3);
  --r:12px;
  --r2:8px;
}

html,body{
  width:100%;height:100%;
  overflow:hidden;
  background:var(--bg);
  color:var(--txt);
  font-family:'Sarabun',sans-serif;
}

/* ── SCROLLBAR ── */
::-webkit-scrollbar{width:3px;height:3px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:rgba(124,111,247,.3);border-radius:4px;}

/* ── NOISE OVERLAY ── */
body::before{
  content:"";
  position:fixed;inset:0;z-index:0;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.03'/%3E%3C/svg%3E");
  opacity:1;pointer-events:none;
}

/* ── NAVBAR ── */
.navbar{
  position:fixed;top:0;left:0;right:0;z-index:100;height:56px;
  display:flex;align-items:center;justify-content:space-between;
  padding:0 20px;
  background:rgba(6,7,13,0.92);
  border-bottom:1px solid var(--border);
  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);
}

.nav-left{display:flex;align-items:center;gap:16px;}

.nav-logo{
  font-family:'Kanit',sans-serif;
  font-weight:900;
  font-size:1.15rem;
  letter-spacing:.12em;
  color:var(--txt);
  display:flex;align-items:center;gap:8px;
}
.nav-logo-dot{
  width:8px;height:8px;border-radius:50%;
  background:var(--accent);
  box-shadow:0 0 10px var(--accent);
  animation:pulse-dot 2s ease-in-out infinite;
}
@keyframes pulse-dot{
  0%,100%{box-shadow:0 0 8px var(--accent),0 0 16px var(--accent-glow);}
  50%{box-shadow:0 0 4px var(--accent);}
}

.nav-divider{width:1px;height:18px;background:var(--border2);}

.nav-tabs{display:flex;gap:2px;}
.nav-tab{
  padding:5px 13px;
  border-radius:20px;
  font-family:'Kanit',sans-serif;
  font-size:.73rem;font-weight:600;
  cursor:pointer;transition:all .2s;
  color:var(--muted);border:none;background:transparent;
  white-space:nowrap;
}
.nav-tab:hover{color:var(--txt2);}
.nav-tab.active{
  background:rgba(124,111,247,.15);
  color:var(--accent);
  border:1px solid var(--border3);
}

.nav-right{display:flex;align-items:center;gap:10px;}

#clock{
  font-family:'Kanit',sans-serif;font-weight:700;
  font-size:.78rem;color:var(--txt2);
  letter-spacing:.06em;
}

.user-pill{
  display:flex;align-items:center;gap:7px;
  background:var(--surface);
  border:1px solid var(--border2);
  border-radius:20px;padding:4px 12px 4px 8px;
  cursor:pointer;transition:border-color .2s;
}
.user-pill:hover{border-color:var(--border3);}
.user-avatar{
  width:22px;height:22px;border-radius:50%;
  background:linear-gradient(135deg,var(--accent),#a78bfa);
  display:flex;align-items:center;justify-content:center;
  font-size:.62rem;font-weight:700;color:#fff;
  font-family:'Kanit',sans-serif;
}
.user-lbl{font-family:'Kanit',sans-serif;font-size:.68rem;font-weight:600;color:var(--txt2);}
.admin-tag{
  display:none;
  font-size:.55rem;font-weight:700;
  padding:1px 5px;border-radius:4px;
  background:rgba(124,111,247,.2);
  border:1px solid var(--border3);
  color:var(--accent);
  font-family:'Kanit',sans-serif;
  letter-spacing:.06em;
}
.logout-btn{
  background:none;border:none;color:var(--muted);
  cursor:pointer;font-size:.7rem;font-family:'Kanit',sans-serif;
  padding:4px 8px;border-radius:6px;transition:all .2s;
}
.logout-btn:hover{color:var(--red);}

/* ── APP CONTAINER ── */
.app{
  position:fixed;inset:0;top:56px;
  overflow-y:auto;overflow-x:hidden;
  scroll-behavior:smooth;
}

/* ── HERO ── */
.hero{
  position:relative;width:100%;
  height:52vh;min-height:300px;max-height:480px;
  display:flex;align-items:flex-end;
  overflow:hidden;cursor:pointer;
}

.hero-bg-wrap{
  position:absolute;inset:0;
  overflow:hidden;
}
.hero-bg{
  position:absolute;inset:-10%;
  background:linear-gradient(125deg,#0a0c1e 0%,#131040 35%,#1a0e2e 60%,#07080f 100%);
  animation:hero-drift 18s ease-in-out infinite alternate;
}
@keyframes hero-drift{
  0%{transform:scale(1.05) translate(0,0);}
  100%{transform:scale(1.1) translate(-2%,-2%);}
}

/* animated grid lines */
.hero-grid{
  position:absolute;inset:0;
  background-image:
    linear-gradient(rgba(124,111,247,.04) 1px, transparent 1px),
    linear-gradient(90deg, rgba(124,111,247,.04) 1px, transparent 1px);
  background-size:60px 60px;
  mask-image:linear-gradient(to bottom,transparent 0%,rgba(0,0,0,.5) 30%,transparent 100%);
}

.hero-glow{
  position:absolute;
  top:20%;left:30%;
  width:400px;height:400px;
  background:radial-gradient(circle,rgba(124,111,247,.15) 0%,transparent 70%);
  transform:translate(-50%,-50%);
  pointer-events:none;
  animation:glow-pulse 4s ease-in-out infinite alternate;
}
@keyframes glow-pulse{
  0%{opacity:.6;transform:translate(-50%,-50%) scale(1);}
  100%{opacity:1;transform:translate(-50%,-50%) scale(1.2);}
}

.hero-grad{
  position:absolute;inset:0;
  background:
    linear-gradient(to right,rgba(6,7,13,.95) 0%,rgba(6,7,13,.6) 45%,transparent 100%),
    linear-gradient(to top,rgba(6,7,13,.98) 0%,rgba(6,7,13,.3) 40%,transparent 70%);
}

.hero-poster{
  position:absolute;
  right:0;top:0;bottom:0;
  width:55%;
  display:flex;align-items:center;justify-content:center;
  overflow:hidden;
}
.hero-poster-inner{
  position:absolute;inset:0;
  display:flex;align-items:center;justify-content:center;
  flex-direction:column;gap:8px;
}
.hero-emoji-big{
  font-size:6rem;line-height:1;
  filter:drop-shadow(0 0 40px rgba(124,111,247,.4));
  animation:float 6s ease-in-out infinite;
}
@keyframes float{
  0%,100%{transform:translateY(0);}
  50%{transform:translateY(-12px);}
}
.hero-poster-grad{
  position:absolute;inset:0;
  background:
    linear-gradient(to left,transparent 0%,rgba(6,7,13,.8) 60%,rgba(6,7,13,.98) 100%),
    linear-gradient(to top,rgba(6,7,13,.95) 0%,transparent 40%);
}

.hero-content{
  position:relative;z-index:2;
  padding:0 28px 32px;
  flex:1;max-width:580px;
}

.hero-meta{
  display:flex;align-items:center;gap:8px;
  margin-bottom:10px;
}

.live-badge{
  display:inline-flex;align-items:center;gap:5px;
  background:var(--red);
  color:#fff;
  font-family:'Kanit',sans-serif;font-size:.62rem;font-weight:700;
  padding:3px 10px;border-radius:4px;
  letter-spacing:.08em;
  box-shadow:0 0 12px rgba(240,64,96,.4);
}
.blink{
  width:5px;height:5px;border-radius:50%;background:#fff;
  animation:blink 1.4s ease-in-out infinite;
}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}

.hero-cat-pill{
  display:inline-flex;align-items:center;gap:4px;
  padding:2px 10px;border-radius:4px;
  font-size:.6rem;font-weight:600;
  font-family:'Kanit',sans-serif;
}

.hero-title{
  font-family:'Kanit',sans-serif;font-weight:800;
  font-size:clamp(1.3rem,3.5vw,2.4rem);
  line-height:1.15;margin-bottom:8px;
  text-shadow:0 2px 20px rgba(0,0,0,.8);
  letter-spacing:-.01em;
}

.hero-desc{
  font-size:.78rem;color:var(--txt2);
  max-width:420px;line-height:1.7;
  margin-bottom:20px;
  display:-webkit-box;
  -webkit-line-clamp:2;
  -webkit-box-orient:vertical;
  overflow:hidden;
}

.hero-btns{display:flex;gap:8px;flex-wrap:wrap;}

.hbtn{
  display:inline-flex;align-items:center;gap:6px;
  padding:9px 22px;border-radius:8px;
  font-family:'Kanit',sans-serif;font-weight:700;font-size:.78rem;
  cursor:pointer;transition:all .22s;
  border:none;text-decoration:none;white-space:nowrap;
}
.hbtn-play{
  background:var(--txt);color:#06070d;
  box-shadow:0 4px 20px rgba(240,242,255,.2);
}
.hbtn-play:hover{
  background:#e8eaff;
  box-shadow:0 6px 28px rgba(240,242,255,.3);
  transform:translateY(-1px);
}
.hbtn-ghost{
  background:rgba(255,255,255,.08);color:var(--txt);
  border:1px solid rgba(255,255,255,.15);
  backdrop-filter:blur(10px);
}
.hbtn-ghost:hover{
  background:rgba(255,255,255,.14);
  border-color:rgba(255,255,255,.25);
  transform:translateY(-1px);
}
.hbtn-accent{
  background:var(--accent);color:#fff;
  box-shadow:0 4px 20px var(--accent-glow);
}
.hbtn-accent:hover{
  background:#8b80f9;
  transform:translateY(-1px);
  box-shadow:0 6px 28px var(--accent-glow);
}

/* ── CATEGORY BAR ── */
.cat-bar-wrap{
  position:sticky;top:0;z-index:10;
  background:rgba(6,7,13,0.95);
  border-bottom:1px solid var(--border);
  backdrop-filter:blur(16px);
}
.cat-bar{
  display:flex;gap:0;
  overflow-x:auto;
  padding:0 16px;
}
.cat-bar::-webkit-scrollbar{display:none;}

.cat-tab{
  display:flex;align-items:center;gap:5px;
  padding:11px 14px;
  font-family:'Kanit',sans-serif;font-size:.74rem;font-weight:600;
  color:var(--muted);cursor:pointer;
  white-space:nowrap;
  border-bottom:2px solid transparent;
  transition:all .2s;
  position:relative;
}
.cat-tab:hover{color:var(--txt2);}
.cat-tab.active{
  color:var(--txt);
  border-bottom-color:var(--accent);
}
.cat-tab .cat-count{
  font-size:.6rem;font-weight:700;
  padding:1px 5px;border-radius:4px;
  background:var(--surface2);
  color:var(--muted);
  min-width:18px;text-align:center;
}
.cat-tab.active .cat-count{
  background:rgba(124,111,247,.2);
  color:var(--accent);
}

/* ── SECTIONS ── */
.sections-area{padding:4px 0 16px;}

.section{padding:20px 16px 8px;}

.section-hdr{
  display:flex;align-items:center;
  justify-content:space-between;
  margin-bottom:14px;
}
.section-title{
  font-family:'Kanit',sans-serif;font-weight:700;
  font-size:.85rem;color:var(--txt);
  display:flex;align-items:center;gap:8px;
}
.section-title-bar{
  width:3px;height:14px;border-radius:2px;
  background:var(--accent);
  box-shadow:0 0 8px var(--accent-glow);
}
.section-cnt{
  font-size:.65rem;color:var(--muted);
  font-weight:400;font-family:'Sarabun',sans-serif;
}

.ch-row{
  display:flex;gap:10px;
  overflow-x:auto;
  padding-bottom:10px;
  scroll-snap-type:x mandatory;
  -webkit-overflow-scrolling:touch;
}
.ch-row::-webkit-scrollbar{height:2px;}

/* ── CHANNEL CARD ── */
.ch-card{
  flex-shrink:0;width:148px;
  border-radius:var(--r);
  overflow:visible;cursor:pointer;
  transition:transform .22s cubic-bezier(.34,1.56,.64,1);
  scroll-snap-align:start;
  position:relative;
}
.ch-card:hover{transform:translateY(-4px);}
.ch-card-inner{
  border-radius:var(--r);overflow:hidden;
  background:var(--surface);
  border:1px solid var(--border);
  transition:border-color .22s,box-shadow .22s;
}
.ch-card:hover .ch-card-inner{
  border-color:var(--border2);
  box-shadow:0 8px 32px rgba(0,0,0,.6),0 0 0 1px rgba(124,111,247,.1);
}
.ch-card.edit-mode{transform:translateY(0) rotate(-1deg);}
.ch-card.edit-mode .ch-card-inner{
  border-color:rgba(240,64,96,.5);
  box-shadow:0 0 0 1.5px rgba(240,64,96,.3);
}
.ch-card.active-card .ch-card-inner{
  border-color:var(--accent);
  box-shadow:0 0 0 2px var(--accent-glow),0 8px 32px rgba(0,0,0,.6);
}

.ch-thumb{
  width:100%;height:96px;
  display:flex;align-items:center;justify-content:center;
  flex-direction:column;gap:4px;
  position:relative;overflow:hidden;
}
.ch-thumb-ov{
  position:absolute;inset:0;
  background:linear-gradient(to top,rgba(0,0,0,.75) 0%,transparent 55%);
}
.ch-thumb-shine{
  position:absolute;inset:0;
  background:linear-gradient(135deg,rgba(255,255,255,.06) 0%,transparent 50%);
  pointer-events:none;
}

.type-badge{
  position:absolute;top:7px;right:7px;
  font-size:.52rem;padding:2px 6px;
  border-radius:4px;font-weight:700;
  font-family:'Kanit',sans-serif;
  letter-spacing:.05em;
  backdrop-filter:blur(6px);
}
.badge-hls{background:rgba(61,214,140,.15);color:#3dd68c;border:1px solid rgba(61,214,140,.3);}
.badge-yt{background:rgba(240,64,96,.15);color:#f87171;border:1px solid rgba(240,64,96,.3);}
.badge-mp4{background:rgba(96,165,250,.15);color:#93c5fd;border:1px solid rgba(96,165,250,.3);}

.now-bar{
  position:absolute;bottom:0;left:0;right:0;height:2px;
  background:linear-gradient(to right,var(--accent),#a78bfa,var(--red));
  box-shadow:0 0 8px var(--accent-glow);
}

.ch-info{padding:9px 10px 11px;}
.ch-card-name{
  font-family:'Kanit',sans-serif;font-weight:600;font-size:.78rem;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  color:var(--txt);
}
.ch-card-sub{
  font-size:.62rem;color:var(--muted);margin-top:2px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.ch-card-cat{
  display:inline-flex;align-items:center;gap:2px;
  margin-top:5px;font-size:.56rem;
  padding:2px 6px;border-radius:4px;
  font-family:'Kanit',sans-serif;font-weight:600;
}

/* ── DELETE BUTTON ── */
.del-btn{
  position:absolute;top:-8px;left:-8px;
  width:22px;height:22px;border-radius:50%;
  background:var(--red);border:2px solid var(--bg);
  color:#fff;font-size:.65rem;
  cursor:pointer;display:none;align-items:center;justify-content:center;
  z-index:20;transition:transform .15s;
  font-weight:700;
  box-shadow:0 2px 10px rgba(240,64,96,.5);
}
.del-btn:hover{transform:scale(1.2);}
@media(hover:hover){
  .ch-card:hover .del-btn{display:flex;}
  .ch-card.edit-mode .del-btn{display:flex;}
}
@media(hover:none){
  .ch-card.edit-mode .del-btn{display:flex;}
}

/* ── ADD CARD ── */
.add-card{
  flex-shrink:0;width:148px;height:140px;
  border-radius:var(--r);
  border:1px dashed rgba(124,111,247,.25);
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:5px;
  cursor:pointer;transition:all .22s;
  scroll-snap-align:start;
  background:rgba(124,111,247,.03);
}
.add-card:hover{
  border-color:rgba(124,111,247,.5);
  background:rgba(124,111,247,.07);
  transform:translateY(-2px);
}
.add-card-icon{
  width:32px;height:32px;border-radius:50%;
  background:rgba(124,111,247,.12);
  border:1px solid rgba(124,111,247,.25);
  display:flex;align-items:center;justify-content:center;
  color:var(--accent);font-size:1rem;
  transition:all .22s;
}
.add-card:hover .add-card-icon{
  background:rgba(124,111,247,.2);
  box-shadow:0 0 12px var(--accent-glow);
}
.add-card-lbl{
  color:var(--muted);font-size:.66rem;
  font-family:'Kanit',sans-serif;font-weight:600;
}

/* ── EMPTY STATE ── */
.empty-state{
  text-align:center;padding:48px 20px;color:var(--muted);
  font-size:.82rem;line-height:2;
}
.empty-icon{font-size:2.5rem;margin-bottom:8px;opacity:.4;}

/* ── PLAYER MODAL ── */
.player-modal{
  position:fixed;inset:0;z-index:200;
  background:rgba(0,0,0,.85);
  display:none;align-items:center;justify-content:center;
  backdrop-filter:blur(8px);
}
.player-modal.open{display:flex;}

.pm-inner{
  width:94%;max-width:880px;
  background:var(--bg2);
  border-radius:16px;overflow:hidden;
  border:1px solid var(--border2);
  display:flex;flex-direction:column;
  max-height:93vh;
  box-shadow:0 32px 80px rgba(0,0,0,.8),0 0 0 1px rgba(124,111,247,.1);
  animation:modal-in .2s cubic-bezier(.34,1.56,.64,1);
}
@keyframes modal-in{
  from{transform:scale(.96);opacity:0;}
  to{transform:scale(1);opacity:1;}
}

.pm-top{
  display:flex;align-items:center;justify-content:space-between;
  padding:12px 16px;
  background:rgba(255,255,255,.03);
  border-bottom:1px solid var(--border);
  flex-shrink:0;
}
.pm-ch-info{display:flex;align-items:center;gap:10px;}
.pm-icon{
  width:36px;height:36px;border-radius:9px;
  display:flex;align-items:center;justify-content:center;
  font-size:1rem;flex-shrink:0;
}
.pm-titles{}
.pm-name{font-family:'Kanit',sans-serif;font-weight:700;font-size:.85rem;color:var(--txt);}
.pm-sub{font-size:.63rem;color:var(--muted);margin-top:1px;}

.live-pill{
  display:flex;align-items:center;gap:4px;
  background:var(--red-dim);
  border:1px solid rgba(240,64,96,.35);
  color:var(--red);
  padding:3px 9px;border-radius:4px;
  font-size:.58rem;font-weight:700;
  font-family:'Kanit',sans-serif;
  letter-spacing:.08em;
}

.pm-actions{display:flex;align-items:center;gap:6px;}
.pm-action-btn{
  background:rgba(255,255,255,.06);
  border:1px solid var(--border2);
  color:var(--txt2);
  width:30px;height:30px;border-radius:7px;
  cursor:pointer;font-size:.78rem;
  display:flex;align-items:center;justify-content:center;
  transition:all .2s;
}
.pm-action-btn:hover{background:rgba(255,255,255,.12);color:var(--txt);}
.pm-close{
  background:rgba(240,64,96,.1);
  border:1px solid rgba(240,64,96,.25);
  color:var(--red);
  width:30px;height:30px;border-radius:7px;
  cursor:pointer;font-size:.8rem;
  display:flex;align-items:center;justify-content:center;
  transition:all .2s;
}
.pm-close:hover{background:rgba(240,64,96,.2);}

.player-box{
  position:relative;
  padding-top:56.25%;background:#000;
  flex-shrink:0;
}
.player-box video,
.player-box iframe{
  position:absolute;inset:0;width:100%;height:100%;border:none;
}
.player-box video{background:#000;}

.pm-spinner{
  position:absolute;inset:0;
  display:flex;align-items:center;justify-content:center;
  background:rgba(0,0,0,.6);
  opacity:0;transition:opacity .3s;pointer-events:none;
}
.pm-spinner.show{opacity:1;}
.spin{
  width:38px;height:38px;
  border:2.5px solid rgba(255,255,255,.1);
  border-top-color:var(--accent);
  border-radius:50%;
  animation:spin .75s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}

.pm-url-bar{
  display:flex;gap:8px;padding:10px 14px;
  background:rgba(255,255,255,.02);
  border-top:1px solid var(--border);
  flex-shrink:0;
}
.pm-url-inp{
  flex:1;background:var(--surface);
  border:1px solid var(--border2);
  border-radius:8px;padding:8px 12px;
  color:var(--txt);font-family:'Sarabun',sans-serif;

function renderSections(){
  const area=document.getElementById("sectionsArea");
  const filtered=activeCat==="all"?allChannels:allChannels.filter(ch=>ch.category===activeCat);

  if(!filtered.length){
    area.innerHTML=`<div class="empty-state">
      <div class="empty-icon">📭</div>
      ${isAdmin?"ยังไม่มีรายการ กด + เพื่อเพิ่มช่อง":"ยังไม่มีรายการในหมวดนี้"}
    </div>`;
    return;
  }

  const groups={};
  if(activeCat==="all"){
    allCategories.forEach(cat=>{
      const chs=filtered.filter(ch=>ch.category===cat.name);
      if(chs.length)groups[cat.name]={emoji:cat.emoji,items:chs};
    });
    const uncat=filtered.filter(ch=>!ch.category||!allCategories.find(c=>c.name===ch.category));
    if(uncat.length)groups["อื่นๆ"]={emoji:"📌",items:uncat};
  } else {
    groups[activeCat]={emoji:allCategories.find(c=>c.name===activeCat)?.emoji||"",items:filtered};
  }

  area.innerHTML=Object.entries(groups).map(([catName,{emoji,items}])=>{
    const cs=getCatStyle(catName);
    const cards=items.map(ch=>buildCard(ch,cs)).join("");
    const addBtn=isAdmin?`<div class="add-card" onclick="openAddModalWithCat('${catName}')">
      <div class="add-card-icon">＋</div>
      <div class="add-card-lbl">เพิ่มช่อง</div>
    </div>`:"";
    return`<div class="section">
      <div class="section-hdr">
        <div class="section-title">
          <div class="section-title-bar"></div>
          ${emoji} ${catName}
          <span class="section-cnt">${items.length} รายการ</span>
        </div>
      </div>
      <div class="ch-row">${cards}${addBtn}</div>
    </div>`;
  }).join("");

  attachCardEvents();
}

function buildCard(ch,cs){
  const t=ch.type||detectType(ch.url);
  const bc=t==="youtube"?"badge-yt":t==="mp4"?"badge-mp4":"badge-hls";
  const bt=t==="youtube"?"YT":t==="mp4"?"MP4":"HLS";
  const isCur=currentCh&&currentCh.id===ch.id;
  const grad=ch.bg||GRAD_POOL[Math.abs(hashStr(ch.id))%GRAD_POOL.length];
  const delBtn=isAdmin?`<button class="del-btn" data-id="${ch.id}" data-name="${ch.name}">✕</button>`:"";
  const catBadge=ch.category?`<div class="ch-card-cat" style="background:${cs.bg};border:1px solid ${cs.border};color:${cs.txt};">${ch.category}</div>`:"";
  return`<div class="ch-card${isCur?" active-card":""}" data-id="${ch.id}">
    ${delBtn}
    <div class="ch-card-inner">
      <div class="ch-thumb" style="background:${grad};color:#fff;">
        <div style="z-index:1;position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;">
          <span style="font-size:1.5rem;line-height:1;filter:drop-shadow(0 2px 8px rgba(0,0,0,.6));">${ch.emoji||"📺"}</span>
        </div>
        <div class="ch-thumb-ov"></div>
        <div class="ch-thumb-shine"></div>
        <span class="type-badge ${bc}">${bt}</span>
        ${isCur?"<div class='now-bar'></div>":""}
      </div>
      <div class="ch-info">
        <div class="ch-card-name">${ch.name}</div>
        <div class="ch-card-sub">${ch.sub||""}</div>
        ${catBadge}
      </div>
    </div>
  </div>`;
}

function hashStr(s){let h=0;for(let i=0;i<s.length;i++)h=(Math.imul(31,h)+s.charCodeAt(i))|0;return h;}

function attachCardEvents(){
  document.querySelectorAll(".ch-card").forEach(card=>{
    if(card.dataset.evtBound==="1")return;
    card.dataset.evtBound="1";
    const id=card.dataset.id;
    const ch=allChannels.find(c=>c.id===id);
    if(!ch)return;
    if(isTouch){
      let pressTimer=null;
      card.addEventListener("touchstart",e=>{
        if(e.target.closest(".del-btn"))return;
        pressTimer=setTimeout(()=>enterEditMode(card),500);
      },{passive:true});
      card.addEventListener("touchend",()=>clearTimeout(pressTimer),{passive:true});
      card.addEventListener("touchmove",()=>clearTimeout(pressTimer),{passive:true});
      card.addEventListener("click",e=>{
        if(e.target.closest(".del-btn"))return;
        if(card.classList.contains("edit-mode")){exitEditMode(card);return;}
        selectChannel(ch);
      });
    } else {
      card.addEventListener("click",e=>{
        if(e.target.closest(".del-btn"))return;
        selectChannel(ch);
      });
    }
  });
  if(isAdmin){
    document.querySelectorAll(".del-btn").forEach(btn=>{
      if(btn.dataset.evtBound==="1")return;
      btn.dataset.evtBound="1";
      btn.addEventListener("click",e=>{
        e.stopPropagation();
        openConfirm(btn.dataset.id,btn.dataset.name);
      });
    });
  }
}

// ── Cloudflare Proxy ──
const PROXY_BASE="https://sx-hls-proxy.suprawat4719.workers.dev";
function proxyUrl(url){return PROXY_BASE+"/proxy?url="+encodeURIComponent(url);}

// ── เล่น HLS: ตรง → proxy อัตโนมัติ → fallback MX ──
function playHLS(url,viaProxy){
  viaProxy=viaProxy||false;
  const v=document.getElementById("pmVideo");
  showSpinner(true);
  const srcUrl=viaProxy?proxyUrl(url):url;

  if(typeof Hls==="undefined"){playNative(srcUrl);return;}

  if(Hls.isSupported()){
    if(modalHls){modalHls.destroy();modalHls=null;}
    modalHls=new Hls({
      enableWorker:true,
      lowLatencyMode:true,
      backBufferLength:30,
      xhrSetup:function(xhr){xhr.withCredentials=false;}
    });
    modalHls.loadSource(srcUrl);
    modalHls.attachMedia(v);
    var started=false;
    var hlsTimer=setTimeout(function(){
      if(!started){
        modalHls.destroy();modalHls=null;
        if(!viaProxy){
          showToast("⚡ ลอง proxy อัตโนมัติ...");
          setTimeout(function(){playHLS(url,true);},500);
        } else {
          showSpinner(false);
          showFallbackPanel(url,"timeout");
        }
      }
    },10000);
    modalHls.on(Hls.Events.MANIFEST_PARSED,function(){
      started=true;
      clearTimeout(hlsTimer);
      v.style.display="block";
      showSpinner(false);
      v.play().catch(function(){});
    });
    modalHls.on(Hls.Events.ERROR,function(e,data){
      if(data.fatal){
        clearTimeout(hlsTimer);
        modalHls.destroy();modalHls=null;
        if(!viaProxy){
          showToast("⚡ ลอง proxy อัตโนมัติ...");
          setTimeout(function(){playHLS(url,true);},500);
        } else {
          showSpinner(false);
          showFallbackPanel(url,"hls_error");
        }
      }
    });
  } else if(v.canPlayType("application/vnd.apple.mpegurl")){
    playNative(srcUrl);
  } else {
    showFallbackPanel(url,"not_supported");
  }
}

// ── เล่น MP4 ──
function playMP4(url){
  const v=document.getElementById("pmVideo");
  showSpinner(true);
  v.src=url;
  v.style.display="block";
  v.play().then(()=>{
    showSpinner(false);
  }).catch(()=>{
    showSpinner(false);
    showFallbackPanel(url,"mp4_error");
  });
  v.onerror=()=>{showSpinner(false);showFallbackPanel(url,"mp4_error");};
}

// ── native video tag ──
function playNative(url){
  const v=document.getElementById("pmVideo");
  v.src=url;
  v.style.display="block";
  v.play().then(()=>showSpinner(false)).catch(()=>{
    showSpinner(false);
    showFallbackPanel(url,"native_error");
  });
  v.onerror=()=>{showSpinner(false);showFallbackPanel(url,"native_error");};
}

// ── Fallback Panel (MX / VLC / Copy) ──
function showFallbackPanel(url,reason){
  const reasonMsg={
    hls_error:"stream นี้โหลดไม่ได้ใน browser",
    timeout:"stream ใช้เวลานานเกินไป",
    mp4_error:"ไฟล์ MP4 เล่นไม่ได้ใน browser",
    not_supported:"browser ไม่รองรับ HLS",
    native_error:"เล่นใน browser ไม่ได้",
  };
  const msg=reasonMsg[reason]||"เล่นใน browser ไม่ได้";
  const title=encodeURIComponent(document.getElementById("pmName").textContent);
  const intent=`intent:${url}#Intent;package=com.mxtech.videoplayer.ad;S.title=${title};end`;
  const vlc=`vlc://${url}`;

  const box=document.querySelector(".player-box");
  let fb=document.getElementById("fallbackPanel");
  if(!fb){fb=document.createElement("div");fb.id="fallbackPanel";box.appendChild(fb);}
  fb.style.cssText="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:var(--bg2);z-index:10;padding:24px;text-align:center;";
  fb.innerHTML=`
    <div style="width:48px;height:48px;border-radius:12px;background:rgba(240,64,96,.1);border:1px solid rgba(240,64,96,.25);display:flex;align-items:center;justify-content:center;font-size:1.4rem;">⚠️</div>
    <div>
      <div style="font-family:'Kanit',sans-serif;font-weight:700;font-size:.9rem;color:var(--txt);margin-bottom:4px;">เปิดใน Browser ไม่ได้</div>
      <div style="font-size:.68rem;color:var(--muted);line-height:1.7;">${msg}<br>ลองเปิดด้วยแอปภายนอก</div>
    </div>
    <div style="display:flex;flex-direction:column;gap:8px;width:230px;">
      <a href="${intent}" onclick="tryMXIntent(this)" style="display:flex;align-items:center;justify-content:center;gap:7px;background:#ff6600;color:#fff;padding:11px 0;border-radius:9px;font-family:'Kanit',sans-serif;font-weight:700;font-size:.8rem;text-decoration:none;box-shadow:0 4px 16px rgba(255,102,0,.3);">📱 เปิด MX Player</a>
      <a href="${vlc}" style="display:flex;align-items:center;justify-content:center;gap:7px;background:rgba(251,146,60,.1);border:1px solid rgba(251,146,60,.3);color:#fdba74;padding:11px 0;border-radius:9px;font-family:'Kanit',sans-serif;font-weight:700;font-size:.8rem;text-decoration:none;">🎬 เปิด VLC</a>
      <button onclick="navigator.clipboard.writeText('${url}').then(()=>showToast('คัดลอก URL แล้ว ✅'))" style="background:rgba(255,255,255,.05);border:1px solid var(--border2);color:var(--muted);padding:9px 0;border-radius:8px;font-family:'Kanit',sans-serif;font-size:.7rem;cursor:pointer;width:100%;transition:all .2s;">📋 คัดลอก URL</button>
      <button onclick="retryHLS('${url}')" style="background:rgba(124,111,247,.1);border:1px solid rgba(124,111,247,.25);color:var(--accent);padding:9px 0;border-radius:8px;font-family:'Kanit',sans-serif;font-size:.7rem;cursor:pointer;width:100%;">🔄 ลองใหม่อีกครั้ง</button>
    </div>`;
  fb.style.display="flex";
}

function toEmbed(url){
  if(url.includes("/embed/"))return addAP(url);
  if(url.includes("watch?v=")){try{const v=new URL(url).searchParams.get("v");return`https://www.youtube.com/embed/${v}?autoplay=1&rel=0`;}catch{}}
  if(url.includes("youtu.be/")){const v=url.split("youtu.be/")[1].split("?")[0];return`https://www.youtube.com/embed/${v}?autoplay=1&rel=0`;}
  if(url.includes("/channel/")){const c=url.split("/channel/")[1].split("/")[0];return`https://www.youtube.com/embed/live_stream?channel=${c}&autoplay=1`;}
  return null;
}
function addAP(u){return u.includes("autoplay=1")?u:u+(u.includes("?")?"&":"?")+"autoplay=1";}
function showSpinner(v){document.getElementById("pmSpinner").classList.toggle("show",v);}

function detectType(url){
  if(!url)return"hls";
  const u=url.toLowerCase();
  if(u.includes("youtube.com")||u.includes("youtu.be"))return"youtube";
  if(u.endsWith(".mp4")||u.includes(".mp4?"))return"mp4";
  return"hls";
}

}

window.addCategory=async function(){
  const name=document.getElementById("catName").value.trim();
  const emoji=document.getElementById("catEmoji").value.trim()||"📺";
  if(!name){showToast("กรุณากรอกชื่อหมวดหมู่");return;}
  if(allCategories.find(c=>c.name===name)){showToast("มีหมวดหมู่นี้แล้ว");return;}
  try{
    await addDoc(collection(db,"categories"),{name,emoji,order:allCategories.length,createdAt:Date.now()});
    document.getElementById("catName").value="";
    document.getElementById("catEmoji").value="";
    showToast(`✅ เพิ่มหมวด "${name}" แล้ว`);
  }catch(e){showToast("ผิดพลาด: "+e.message);}
};
document.getElementById("catName").addEventListener("keydown",e=>{if(e.key==="Enter")addCategory();});

window.deleteCategory=async function(id,name){
  const inUse=allChannels.filter(c=>c.category===name).length;
  if(inUse>0){showToast(`มี ${inUse} รายการในหมวดนี้ กรุณาย้ายก่อนลบ`);return;}
  try{
    await deleteDoc(doc(db,"categories",id));
    showToast(`🗑 ลบหมวด "${name}" แล้ว`);
    if(activeCat===name)filterCat("all",null);
  }catch(e){showToast("ลบไม่สำเร็จ: "+e.message);}
};

function showToast(msg){
  const t=document.getElementById("toast");
  t.textContent=msg;t.style.display="block";
  clearTimeout(t._t);t._t=setTimeout(()=>t.style.display="none",3000);
}

document.addEventListener("keydown",e=>{
  if(e.key==="Escape"){closePlayerModal();closeAddModal();closeConfirm();closeCatModal();}
});
</script>
